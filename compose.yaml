
services:
  postgres:
    image: postgres:17
    container_name: ai-issue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: issue_copilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U issue_user -d issue_copilot
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
